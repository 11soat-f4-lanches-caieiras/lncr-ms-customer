spring:
  application:
    name: customer
  server:
    port: "${SERVER_PORT:8080}"
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  data:
    mongodb:
      uri: "${MONGODB_URI}"
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
lncr:
  internalUrl: "${LNCR_ALB_URL:http://localhost:8080}"
  externalUrl: "${LNCR_EXTERNAL_URL}"
  customer:
    location-prefix: "${lncr.externalUrl}/customers"


