#valores padrões para o Helm Chart

#ServiceAccount
serviceAccount:
  name: secrets-sa

#Aplicação
app:
  name: customer
  replicas: 1
  image:
    repository: ${AWS_ECR_REPOSITORY}
    tag: latest
    pullPolicy: IfNotPresent
  port: 8080
  containerName: customer
  baseUrl: ${LNCR_BASE_URL}
  internalUrl: ${LNCR_INTERNAL_URL}
  externalUrl: ${LNCR_EXTERNAL_URL}
  mercadopago:
    oauthUrl: ${MERCADOPAGO_OAUTH_URL}
    ordersUrl: ${MERCADOPAGO_ORDERS_URL}

#Service
service:
  port: 80
  targetPort: 8080

#Ingress
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/subnets: "subnet-0cfbff4d1c71d4495,subnet-0c0258d29df8ebaf2"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/security-groups: sg-072222a6f137b812d
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
  hosts:
  - host: ${INGRESS_HOST}
    paths:
    - path: /
      pathType: Prefix
  tls: []


#Storage
storage:
  fsx:
    server: "10.1.39.161" 
    path: "/fsx"  


#Deployment
resources:
  lanchesCaieirasApp:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

#HPA
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

#SecretProviderClass
secretProviderClass:
  name: "lncr-ms-customer-prd-secrets"
  namespace: production
  provider: aws
  parameters:
    region: "us-east-1"
    objects:
      - objectName: arn:aws:secretsmanager:us-east-1:080145351546:secret:lncr-ms-customer-prd-secret-6ZXgHo
        objectType: secretsmanager
  keys:
    - LNCR_OAUTH_ADMIN_CLIENT_ID
    - LNCR_OAUTH_ADMIN_CLIENT_SECRET
    - LNCR_OAUTH_MONITOR_CLIENT_ID
    - LNCR_OAUTH_MONITOR_CLIENT_SECRET
    - LNCR_OAUTH_TOTEM_CLIENT_ID
    - LNCR_OAUTH_TOTEM_CLIENT_SECRET
    - LNCR_OAUTH_SECRET_KEY
    - MERCADOPAGO_CLIENT_ID
    - MERCADOPAGO_SECRET_ID
    - MERCADOPAGO_POS_ID
    - MONGO_URI
    - MONGO_DATABASE
    - MONGO_USERNAME
    - MONGO_PASSWORD
  secretObjects:
    - secretName: customer-secret
      type: Opaque
  twoSecrets:
    enabled: false
deploySecretName: customer-secret
