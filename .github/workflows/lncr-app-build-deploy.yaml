  deploy:
    name: Deploy no Cluster Kubernetes
    runs-on: codebuild-github-lncr-app-${{ github.run_id }}-${{ github.run_attempt }}
    #needs: [approve-after-build, approve-helm-only]
    #if: ${{ always() && (needs.approve-after-build.result == 'success' || needs.approve-helm-only.result == 'success') }}
    environment:
      name: ${{ github.ref_name == 'master' && 'prd' || 'dev' }}
    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4

      - name: Instalar Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Configurar kubectl
        run: |
          aws eks update-kubeconfig --region ${{ vars.AWS_DEFAULT_REGION }} --name ${{ vars.EKS_CLUSTER }}

      - name: Obter subredes do EKS
        run: |
          EKS_SUBNETS=$(aws eks describe-cluster --name ${{ vars.EKS_CLUSTER }} --query 'cluster.resourcesVpcConfig.subnetIds' --output text | sed 's/\t/--/g')
          echo "EKS_SUBNETS=$EKS_SUBNETS" >> $GITHUB_ENV

      - name: Deploy com Helm
        run: |
          COMMIT_HASH="$(git rev-parse --short HEAD)"
          ECR_REGISTRY="080145351546.dkr.ecr.us-east-1.amazonaws.com"
          
          printf -v SUBNET_ARG -- '--set-string service.nlb.subnets=%s' "${{ env.EKS_SUBNETS }}"
          
          helm upgrade --install lncr-app ./iac/kubernetes \
            --set app.image.repository="$ECR_REGISTRY"/${{ env.ECR_REPOSITORY }} \
            --set app.image.tag="$COMMIT_HASH" \
            --set app.containerName=lncr-app \
            --set app.baseUrl="${{ env.LNCR_BASE_URL }}" \
            --set app.externalUrl="${{ env.LNCR_EXTERNAL_URL }}" \
            --set app.mercadopago.oauthUrl="${{ env.MERCADOPAGO_OAUTH_URL }}" \
            --set app.mercadopago.ordersUrl="${{ env.MERCADOPAGO_ORDERS_URL }}" \
            --set app.mercadopago.secretId="${{ env.MERCADOPAGO_SECRET_ID }}" \
            --set app.mercadopago.clientId="${{ env.MERCADOPAGO_CLIENT_ID }}" \
            --set app.mercadopago.posId="${{ env.MERCADOPAGO_POS_ID }}" \
            $SUBNET_ARG \
            --set secrets.oauthAdminClientId="${{ env.LNCR_OAUTH_ADMIN_CLIENT_ID }}"\
            --set secrets.oauthAdminClientSecret="${{ env.LNCR_OAUTH_ADMIN_CLIENT_SECRET }}" \
            --set secrets.oauthMonitorClientId="${{ env.LNCR_OAUTH_MONITOR_CLIENT_ID }}" \
            --set secrets.oauthMonitorClientSecret="${{ env.LNCR_OAUTH_MONITOR_CLIENT_SECRET }}" \
            --set secrets.oauthTotemClientId="${{ env.LNCR_OAUTH_TOTEM_CLIENT_ID }}" \
            --set secrets.oauthTotemClientSecret="${{ env.LNCR_OAUTH_TOTEM_CLIENT_SECRET }}" \
            --set secrets.oauthSecretKey="${{ env.LNCR_OAUTH_SECRET_KEY }}" \
            --set secrets.mercadopagoClientId="${{ env.MERCADOPAGO_CLIENT_ID }}" \
            --set secrets.mercadopagoSecretId="${{ env.MERCADOPAGO_SECRET_ID }}" \
            --set secrets.mercadopagoPosId="${{ env.MERCADOPAGO_POS_ID }}" \
            --set secrets.postgresUrl="${{ env.POSTGRES_URL }}" \
            --set secrets.postgresUser="${{ env.POSTGRES_USER }}" \
            --set secrets.postgresPassword="${{ env.POSTGRES_PASSWORD }}" \
            --set app.name=lncr-app \
            --namespace fiap --create-namespace \
            --force
      
      - name: Trigger lncr-iac-configuration deployment
        uses: peter-evans/repository-dispatch@v2
        if: github.event_name == 'repository_dispatch'
        with:
          token: ${{ secrets.REPO_TOKEN}}
          repository: 11soat-f3-lanches-caieiras/lncr-iac
          event-type: infra-iac-completed
          client-payload: |
            {
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}"
            }
