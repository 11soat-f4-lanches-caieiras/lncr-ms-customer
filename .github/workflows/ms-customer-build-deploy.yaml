  approve-helm-only:
    name: Manual Approval (helm only)
    runs-on: ubuntu-latest
    if: ${{ inputs.only-helm-deploy }}
    steps:
      - name: Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: gustavo-log,titoparizotto
          minimum-approvals: 1
          issue-title: "Deploy Infrastructure to Production"
          issue-body: "Please approve the deployment of infrastructure changes."
    environment:
      name: ${{ github.ref_name == 'master' && 'prd' || 'dev' }}

  helm-deploy-after-approve:
    name: Deploy com Helm
    needs: [approve-helm-only, approve-after-build]
    if: ${{ always() && (needs.approve-after-build.result == 'success' || needs.approve-helm-only.result == 'success') }}
    runs-on: codebuild-github-lncr-app-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: ${{ github.ref_name == 'master' && 'prd' || 'dev' }}
    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4

      - name: Instalar Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Configurar kubectl
        run: |
          aws eks update-kubeconfig --region ${{ vars.AWS_DEFAULT_REGION }} --name ${{ vars.EKS_CLUSTER }}

      - name: Deploy com Helm
        env:
          LNCR_INTERNAL_URL: ${{ env.LNCR_INTERNAL_URL }}
          LNCR_EXTERNAL_URL: ${{ env.LNCR_EXTERNAL_URL }}
        run: |
          COMMIT_HASH="$(git rev-parse --short HEAD)"
          ECR_REGISTRY="080145351546.dkr.ecr.us-east-1.amazonaws.com"
          NAMESPACE="${{ github.ref_name == 'master' && 'lncr-prd' || 'lncr-dev' }}"
          IMAGE_TAG="${COMMIT_HASH}"

          cd iac/kubernetes

          # Desabilitar ingress se INGRESS_HOST estiver vazio
          INGRESS_ENABLED="true"
          if [ -z "${{ env.INGRESS_HOST }}" ]; then
            INGRESS_ENABLED="false"
          fi

          helm upgrade --install lncr-ms-customer . \
            --namespace ns-lncr-prd \
            --create-namespace \
            --set app.image.repository=${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }} \
            --set app.image.tag=${IMAGE_TAG} \
            --set app.internalUrl="${{ env.LNCR_INTERNAL_URL }}" \
            --set app.externalUrl="${{ env.LNCR_EXTERNAL_URL }}" \
            --set ingress.enabled=${INGRESS_ENABLED} \
            --set ingress.hosts[0].host="${{ env.INGRESS_HOST }}" \
            --force

