name: Construir e Upload da Aplicação lncr-ms-customer
on:
  repository_dispatch:
    types: [infra-base-completed]

  workflow_dispatch:
    inputs:
      only-helm-deploy:
        description: 'Only Helm Deploy (skip build and upload)'
        required: false
        default: false
        type: boolean

  workflow_call:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: 'develop'
        type: string

env:
  #variáveis
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
  EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}
  LNCR_BASE_URL: ${{ vars.LNCR_BASE_URL }}
  LNCR_EXTERNAL_URL: ${{ vars.LNCR_EXTERNAL_URL }}
  APP_DOMAIN: 'customer'
  DOCKERFILE_TEMPLATE_URL: 'https://raw.githubusercontent.com/11soat-f4-lanches-caieiras/lncr-commons/master/templates/Dockerfile'
  DOCKERFILE_PATH: 'customer/Dockerfile'
  MAVEN_TEMPLATE_URL: 'https://raw.githubusercontent.com/11soat-f4-lanches-caieiras/lncr-commons/master/templates/maven_settings.xml'
  MAVEN_SETTINGS_PATH: 'customer/maven_settings.xml'
  MAVEN_POM_PATH: 'customer/pom.xml'
  JACOCO_REPORT_PATH: 'customer/target/site/jacoco/jacoco.xml'


  # secrets
  LNCR_MAVEN_ACTOR: ${{ secrets.LNCR_MAVEN_ACTOR }}
  LNCR_MAVEN_PAT: ${{ secrets.LNCR_MAVEN_PAT }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_ACTOR: ${{ github.actor}}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


jobs:
  build-and-upload:
    name: Construir e Fazer Upload da Imagem Docker para ECR
    runs-on: codebuild-github-lncr-app-${{ github.run_id }}-${{ github.run_attempt }}
    #Disparado via repository_dispatch do repositório lncr-iac
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && !inputs.only-helm-deploy }}
    environment:
      name: ${{ github.ref_name == 'master' && 'prd' || 'dev' }}
    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configurar templates Docker e Maven
        env:
          DOCKERFILE_TEMPLATE_URL: ${{ env.DOCKERFILE_TEMPLATE_URL }}
          DOCKERFILE_PATH: ${{ env.DOCKERFILE_PATH }}
          MAVEN_TEMPLATE_URL: ${{ env.MAVEN_TEMPLATE_URL }}
          MAVEN_SETTINGS_PATH: ${{ env.MAVEN_SETTINGS_PATH }}
          APP_DOMAIN: ${{ env.APP_DOMAIN }}
          LNCR_MAVEN_PAT: ${{ env.LNCR_MAVEN_PAT }}
        run: |
              echo "Obtendo template do maven_settings.xml"
              curl --silent --location --request GET $MAVEN_TEMPLATE_URL \
              --header 'Authorization: token ${LNCR_MAVEN_PAT}' \
              --output $MAVEN_SETTINGS_PATH
          
              cat $MAVEN_SETTINGS_PATH
              
              echo "Obtendo template do Docker File"
              curl --silent --location --request GET $DOCKERFILE_TEMPLATE_URL \
              --header 'Authorization: token ${LNCR_MAVEN_PAT}' \
              --output $DOCKERFILE_PATH
          
              echo "Configurando Dockerfile para o dominio $APP_DOMAIN"
              sed -i "s/##APP_DOMAIN##/$APP_DOMAIN/g" $DOCKERFILE_PATH
          
              cat $$DOCKERFILE_PATH

